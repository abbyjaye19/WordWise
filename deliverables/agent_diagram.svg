<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Atkinson Hyperlegible, Verdana, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">WordWise agent architecture</title>
  <desc id="d">A student uses the Reading Studio in the browser. Reading tools, read-along, and display settings run in the browser with no AI. AI requests go from the Dash server through a guard layer, which holds six single-call helpers that share one cached prompt prefix and receive the student's reader level and self-reported profile, then through the Portkey gateway to gpt-6-luna on Azure OpenAI. Accounts and saved work stay in a local database; only the short self-reported profile text is sent with requests.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F1F3D"/>
    </marker>
    <style>
      .box { fill:#F4EEE1; stroke:#0F1F3D; stroke-width:2; }
      .dark { fill:#24503A; stroke:#0F1F3D; stroke-width:2; }
      .agent { fill:#E1F0DC; stroke:#3F7350; stroke-width:2; }
      .new { fill:#F0F7EC; stroke:#3F7350; stroke-width:2; stroke-dasharray:6 3; }
      .h { font-family:'Libre Baskerville', Georgia, serif; font-weight:700; fill:#1B3366; font-size:16px; }
      .hw { font-family:'Libre Baskerville', Georgia, serif; font-weight:700; fill:#FBF8F1; font-size:17px; }
      .t { fill:#0F1F3D; font-size:13px; }
      .tw { fill:#F4EEE1; font-size:13px; }
      .s { fill:#4A5874; font-size:12px; }
      .tag { fill:#8A6630; font-size:11px; font-weight:700; letter-spacing:.5px; }
      .tagw { fill:#E9D3A6; font-size:11px; font-weight:700; letter-spacing:.5px; }
      .line { stroke:#0F1F3D; stroke-width:2; fill:none; }
    </style>
  </defs>
  <rect width="1000" height="760" fill="#FBF8F1"/>

  <!-- Student + browser -->
  <rect class="box" x="20" y="24" width="270" height="300" rx="12"/>
  <text class="tag" x="36" y="48">IN THE BROWSER</text>
  <text class="h" x="36" y="74">Student</text>
  <text class="t" x="36" y="96">Reader level: 4 levels, ages 5 to 18+</text>
  <text class="t" x="36" y="114">Profile: what I find hard (8 areas)</text>
  <text class="h" x="36" y="146">Reading Studio (studio.js)</text>
  <text class="t" x="36" y="168">Upload PDF · slides · Word · text</text>
  <text class="t" x="36" y="186">Read-along with highlighting:</text>
  <text class="t" x="36" y="203">replay · speed · natural-voice picker</text>
  <text class="t" x="36" y="221">Highlighter · ruler · focus mode</text>
  <text class="t" x="36" y="239">8 reading settings, saved per account</text>
  <text class="t" x="36" y="257">Original / Simplified / Detailed views</text>
  <text class="s" x="36" y="290">Display and read-aloud use no AI:</text>
  <text class="s" x="36" y="307">free, run in the browser</text>

  <!-- Dash server -->
  <rect class="box" x="20" y="350" width="270" height="190" rx="12"/>
  <text class="tag" x="36" y="374">WORDWISE SERVER (DASH)</text>
  <text class="t" x="36" y="398">Pages, accounts, uploads, exports,</text>
  <text class="t" x="36" y="415">insights dashboard, check-ins</text>
  <rect x="36" y="432" width="238" height="92" rx="8" fill="#FBF8F1" stroke="#B08D57" stroke-width="1.5"/>
  <text class="t" x="48" y="454" font-weight="700">SQLite database</text>
  <text class="s" x="48" y="472">accounts · folders · readings</text>
  <text class="s" x="48" y="489">words · goals · check-ins · usage</text>
  <text class="s" x="48" y="508">Only the profile text goes to the AI</text>

  <path class="line" d="M155 324 L155 350" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- Guard layer with agents -->
  <rect class="dark" x="320" y="24" width="410" height="716" rx="14"/>
  <text class="tagw" x="340" y="50">services/ai.py — GUARD LAYER</text>
  <text class="tw" x="340" y="74">Before: daily spending cap · input size caps ·</text>
  <text class="tw" x="340" y="91">reading wrapped in &lt;reading&gt; tags (data, not orders)</text>
  <text class="tw" x="340" y="108">After: model must be gpt-6-luna · token + cost log</text>

  <rect x="340" y="122" width="370" height="58" rx="10" fill="#B08D57" stroke="#0F1F3D" stroke-width="2"/>
  <text class="t" x="356" y="144" font-weight="700">Shared cached prompt (~1,700 tokens)</text>
  <text class="t" x="356" y="164">safety + adapt-to-student rules + reader-level guide</text>

  <rect class="agent" x="340" y="192" width="370" height="78" rx="10"/>
  <text class="h" x="356" y="216">Word Coach</text>
  <text class="t" x="356" y="237">Tapped word → meaning here, syllables, say-it</text>
  <text class="s" x="356" y="257">WordHelp (fixed JSON) · $0.00009 / call</text>

  <rect class="agent" x="340" y="280" width="370" height="78" rx="10"/>
  <text class="h" x="356" y="304">Explainer</text>
  <text class="t" x="356" y="325">Selected passage → simpler / example / steps</text>
  <text class="s" x="356" y="345">Explanation (fixed JSON) · $0.00008 / call</text>

  <rect class="agent" x="340" y="368" width="370" height="78" rx="10"/>
  <text class="h" x="356" y="392">Comprehension Coach</text>
  <text class="t" x="356" y="413">Big idea, key points, words, 3 check questions</text>
  <text class="s" x="356" y="433">Summary (fixed JSON) · $0.00022 / call</text>

  <rect class="new" x="340" y="456" width="370" height="78" rx="10"/>
  <text class="h" x="356" y="480">Reading Levels</text>
  <text class="t" x="356" y="501">Whole reading → simplified or detailed wording</text>
  <text class="s" x="356" y="521">Rewrite (JSON, per paragraph) · $0.00015 / chunk</text>

  <rect class="new" x="340" y="544" width="370" height="78" rx="10"/>
  <text class="h" x="356" y="568">Pronunciation Helper</text>
  <text class="t" x="356" y="589">Respells words voices get wrong (“read” → “red”)</text>
  <text class="s" x="356" y="609">Pronunciation (JSON) · $0.00016 / chunk</text>

  <rect class="agent" x="340" y="632" width="370" height="96" rx="10"/>
  <text class="h" x="356" y="656">AI Tutor (chat)</text>
  <text class="t" x="356" y="677">Sees the open reading; guides, never writes</text>
  <text class="t" x="356" y="694">homework; suggests settings → student Applies</text>
  <text class="s" x="356" y="715">TutorReply (JSON, checked in code) · $0.00014</text>

  <path class="line" d="M290 150 L320 150" marker-end="url(#arr)"/>

  <!-- Gateway + model -->
  <rect class="box" x="752" y="150" width="232" height="150" rx="12"/>
  <text class="tag" x="772" y="174">PORTKEY GATEWAY</text>
  <text class="t" x="772" y="198">Key: PORTKEY_API_KEY</text>
  <text class="t" x="772" y="218">Replay cache: identical</text>
  <text class="t" x="772" y="235">request → stored answer, $0</text>
  <text class="s" x="772" y="262">x-portkey-cache-status: HIT</text>
  <text class="s" x="772" y="279">logged as free</text>

  <rect class="dark" x="752" y="340" width="232" height="170" rx="12"/>
  <text class="tagw" x="772" y="364">AZURE OPENAI</text>
  <text class="hw" x="772" y="390">gpt-6-luna</text>
  <text class="tw" x="772" y="414">One model for every helper</text>
  <text class="tw" x="772" y="434">Prompt cache (1,024+)</text>
  <text class="tw" x="772" y="454">Content filter blocks</text>
  <text class="tw" x="772" y="471">jailbreak attempts upstream</text>
  <text class="tw" x="772" y="494">Reasoning effort: low</text>

  <path class="line" d="M730 225 L752 225" marker-end="url(#arr)"/>
  <path class="line" d="M868 300 L868 340" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text class="s" x="868" y="548" text-anchor="middle">No tools, no agent loops:</text>
  <text class="s" x="868" y="566" text-anchor="middle">1 click = 1 call (long readings:</text>
  <text class="s" x="868" y="584" text-anchor="middle">a few parallel chunks, capped)</text>
  <rect x="772" y="612" width="18" height="12" rx="3" class="new"/>
  <text class="s" x="798" y="622">added in the latest version</text>
  <rect x="772" y="634" width="18" height="12" rx="3" class="agent"/>
  <text class="s" x="798" y="644">original helpers</text>

  <!-- Footer -->
  <text class="s" x="20" y="580">WordWise · MGT 409 final project</text>
  <text class="s" x="20" y="600">Costs: measured average per call,</text>
  <text class="s" x="20" y="617">warm cache, Oct 25 2026</text>
  <text class="s" x="20" y="634">(output/tokenomics/)</text>
</svg>
